[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-contracts"
version = "0.1.0a1"
description = "Offline regression checks for human replies in interrupted agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Wen Chen"}]
keywords = ["human-in-the-loop", "agents", "langgraph", "regression-testing", "hri"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
interaction-contracts = "interaction_contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
